# Render Blueprint for the AgentSim MCP server (free web service, no card).
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. Or New -> Web
# Service -> Docker, root dir `backend`. Free tier spins down after ~15 min idle
# (cold start ~1 min) — keep it warm by pinging /health (see backend/README).
services:
  - type: web
    name: agentsim-mcp
    runtime: docker
    # Do NOT set `rootDir` here. Render resolves dockerfilePath/dockerContext
    # *underneath* rootDir, so `rootDir: backend` + `./backend/Dockerfile` makes it
    # look for `backend/backend/Dockerfile` — which doesn't exist, so the build
    # exits 1 ("Exited with status 1 while building your code"). Keep the docker
    # paths repo-root-relative (as documented) and scope rebuild triggers with
    # `buildFilter` instead — that's rootDir's only job for a Docker service.
    dockerfilePath: ./backend/Dockerfile   # relative to REPO ROOT
    dockerContext: ./backend               # relative to REPO ROOT
    buildFilter:
      paths:
        - backend/**                       # only rebuild when backend/ changes
    plan: free
    healthCheckPath: /health
    envVars:
      - key: RUN_WORKER
        value: "false"            # read-only MCP deploy — don't run the ingest worker
      - key: MCP_ALLOWED_HOSTS
        value: agentsim-mcp.onrender.com   # MUST match the live <name>.onrender.com host
      - key: DATABASE_URL
        sync: false               # set in the Render dashboard (secret)
      - key: GEMINI_API_KEY
        sync: false               # set in the Render dashboard (secret)
