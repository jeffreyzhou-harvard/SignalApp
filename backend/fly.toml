# Fly.io config for the AgentSim backend + MCP server.
# Deploy from backend/:  fly launch --copy-config --no-deploy  (adopts this file)
# then set secrets (see backend/README) and:  fly deploy
#
# Rename `app` to your chosen name; the public URL becomes https://<app>.fly.dev
# and the MCP endpoint is https://<app>.fly.dev/mcp
app = "agentsim-mcp"
primary_region = "iad"  # us-east, near the Neon database

[build]

[env]
  # Read-only MCP deploy: don't run the ingestion worker (avoids racing a local
  # worker for jobs on shared Neon). Secrets (DATABASE_URL, GEMINI_API_KEY,
  # MCP_ALLOWED_HOSTS) are set via `fly secrets set`, not here.
  RUN_WORKER = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"      # keep warm — no cold start when the agent calls
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
