[project]
name = "agentsim-ml"
version = "0.1.0"
description = "Layer B: embedding, clustering, labeling, and experiment harness for AgentSim"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "plotly>=5.20",
    "umap-learn>=0.5.5",
    "numba>=0.59",
    "requests>=2.31",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
agentsim-run = "agentsim_ml.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentsim_ml"]
